name: tests

# Runs the full regression suite on every push and pull request:
#   1. Native suite -- compile each tests/*.txt ROM, run it through pc_emu, check the return value
#      (see docs/pc-emulator.md). Needs only g++ and Python.
#   2. WASM cross-check -- build the same core with Emscripten and re-run the ROMs run_tests.py
#      just produced (build/roms/*.rom + any .pak) through the browser's WASM module via Node,
#      checking they return the SAME values as pc_emu. This is the strongest evidence the native
#      and browser builds haven't drifted, so it must run in this same job, after run_tests.py --
#      verify_wasm.js doesn't compile ROMs itself, it expects them already sitting in build/roms/.

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14

      - name: Build the desktop emulator
        run: make pc_emu

      - name: Run the regression suite
        run: python run_tests.py

      - name: Build the WASM core
        run: make wasm

      - name: Cross-check the WASM core against pc_emu
        run: node verify_wasm.js
