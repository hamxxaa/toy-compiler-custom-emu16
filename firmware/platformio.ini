; Three build configs from one tree (see plans/humming-splitting-yokoi.md, decision #4 + the ppu_sink
; seam). Same board (esp32-s3-devkitc-1, N16R8) for all three; only the WIRE_ROLE_* define differs:
;   single  -> today's one-board firmware (default). CPU+PPU+APU all local, wire unused.
;   cpu     -> two-chip CPU chip (the clone): emulator + APU + SPI master.  B0 = wire loopback.
;   ppu     -> two-chip PPU chip (the original): ppu.cpp + TFT + SPI slave. B0 = wire loopback.
; Flash a specific board with:  pio run -e cpu -t upload   /   pio run -e ppu -t upload
[platformio]
default_envs = single

[common]
; Shared build flags. The TFT flags describe the PANEL, so they're identical on every config (the PPU
; chip mirrors the clone's TFT pins 8-12 on purpose). Only the WIRE_ROLE_* define is per-env, below.
build_flags =
    ; Shared CPU core headers (emulator/emu.h, definitions.h); emu.cpp comes in via src/emu_shim.cpp.
    -I ../emulator
    -D USER_SETUP_LOADED=1
    -D ST7735_DRIVER=1
    -D ST7735_GREENTAB2=1
    -D TFT_WIDTH=128
    -D TFT_HEIGHT=160
    -D TFT_MOSI=11
    -D TFT_SCLK=12
    -D TFT_CS=10
    -D TFT_DC=9
    -D TFT_RST=8
    -D TFT_MISO=-1
    -D USE_HSPI_PORT=1
    -D LOAD_GLCD=1
    -D SPI_FREQUENCY=60000000
    -D USE_DMA_TO_TFT=1

[env]
; Pinned deliberately. 6.13.0 = Arduino-ESP32 2.0.17 = ESP-IDF 4.4, whose SDK provides the LEGACY
; driver/i2s.h audio API that src/main.cpp's I2S code is written against, and the driver/spi_slave.h
; the inter-chip link uses. The 7.x/Arduino-3.x line would break both silently on a toolchain update.
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

board_build.flash_mode = dio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.filesystem = littlefs
board_build.partitions = default_16MB.csv

lib_deps =
    bodmer/TFT_eSPI@^2.5.43

[env:single]
build_flags = ${common.build_flags}

[env:cpu]
build_flags =
    ${common.build_flags}
    -D WIRE_ROLE_CPU

[env:ppu]
build_flags =
    ${common.build_flags}
    -D WIRE_ROLE_PPU
